name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.6-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.6-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.6-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.6
          name: GitarGame v0.1.0-alpha.6
          prerelease: true
          make_latest: false
          body: |
            Timing-compatibility hotfix focused on chart/audio desync that only appears on some song packs.

            Changes in alpha.6:
            - Gameplay time now advances from a monotonic high-resolution steady clock instead of trusting decoder frame progress as the master rhythm clock
            - Pause/resume and restart explicitly pause/reset the gameplay clock with the audio transport
            - GetMusicTimePlayed is retained as a diagnostic only; GitarGame.log records decoder-vs-realtime drift every five seconds
            - Adds compatibility handling for legacy song.ini delay values written as fractional seconds instead of documented milliseconds
            - Integer song.ini delay values continue to use documented millisecond semantics
            - Logs raw and normalized song delay, detected delay units, chart resolution, tempo-event count, note count, and first/last note times on song load
            - Retains alpha.5 menus, calibration, guitar navigation, song artwork, settings, 3D highway, Unicode fixes, crash dumps, and PDB symbols

            This build specifically targets reports where one chart drifts or appears slower than its audio while other charts stay synchronized. If a song still drifts, attach GitarGame.log; the new diagnostics should distinguish chart-map errors from decoder-clock drift.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.6-win64.zip
