# Alpha.14 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.14-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.14-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.14-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.14
          name: GitarGame v0.1.0-alpha.14
          prerelease: true
          make_latest: false
          body: |
            Gameplay readability refinement on top of alpha.13.

            Receptors / strike bar:
            - Raises fret receptors physically above the strike bar and gives them a dark pedestal
            - Inactive receptors stay visibly colored instead of becoming nearly transparent
            - Strike-bar geometry is lowered so shallow camera angles cannot wash over the receptors

            Hit feedback:
            - Replaces the generic 2D ping rings with a 3D note-shaped bloom
            - Normal notes, HOPOs, taps and open notes each preserve their own silhouette
            - Chords bloom every authored gem at the receptor
            - The hit ghost brightens, expands slightly, lifts away from the highway and fades quickly
            - Realtime hit timestamps keep feedback independent of video calibration

            Miss feedback:
            - Missed gems retain their note type while transitioning toward red
            - Adds a restrained throb/shrink and partial fade as the missed gem passes the strike line
            - Open-note misses use the same red transition on their bar-shaped gem
            - Miss feedback remains separate from hit feedback and does not add a large overlay

            Existing alpha.13 song previews/song completion, alpha.12 calibration,
            MIDI/Opus compatibility and chart verification remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.14-win64.zip
