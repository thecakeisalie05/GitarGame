# Alpha.15 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.15-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.15-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.15-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.15
          name: GitarGame v0.1.0-alpha.15
          prerelease: true
          make_latest: false
          body: |
            Windows hardening release on top of alpha.14.

            Native folder picker:
            - Removes the runtime PowerShell/WinForms folder-picker bridge from GitarGame.exe
            - Uses the Windows Common Item Dialog (IFileDialog/FOS_PICKFOLDERS) directly
            - Keeps COM/shell headers isolated in a tiny helper library so they cannot collide with raylib
            - Uses GitarGame's native HWND as the dialog owner
            - Temporarily leaves fullscreen while the native dialog is open, then restores fullscreen and focus
            - Preserves UTF-8 song-directory paths through explicit UTF-16 to UTF-8 conversion
            - Source generation fails if the old powershell.exe/_popen/WinForms bridge is still present

            Release intent:
            - Rebuilds the executable after alpha.14 was reported as "Virus detected" by Edge/Defender
            - Does not disable, bypass or whitelist antivirus protection
            - Keeps alpha.14 gameplay visuals and all previous compatibility/calibration behavior

            Existing alpha.14 gameplay readability, alpha.13 previews/song completion,
            alpha.12 calibration, MIDI/Opus compatibility and chart verification remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.15-win64.zip
