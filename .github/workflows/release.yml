# Alpha.25 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.25-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.25-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.25-win64.zip

      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.25
          name: GitarGame v0.1.0-alpha.25
          prerelease: true
          make_latest: false
          body: |
            Whammy synchronization and instrument-mute correction on top of alpha.24.

            - Removes raylib SetMusicPitch from gameplay whammy because it changes playback rate
            - Adds a time-preserving stream DSP pitch-bend effect on the playable instrument stem
            - Keeps the music clock at 1x speed so whammy no longer drifts out of sync
            - Expands guitar/rhythm stem detection to common real-world filename variants
            - Mutes every recognized guitar/rhythm stem to 0 on a miss
            - Restores instrument stems to the normal 0.58 gameplay mix level on the next successful note
            - Keeps the procedural miss thunk and alpha.24 white hit-flash polish

            Alpha.23 HOPO compatibility and all prior gameplay/UI improvements remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.25-win64.zip
