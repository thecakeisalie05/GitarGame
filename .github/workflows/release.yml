# Alpha.20 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.20-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.20-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.20-win64.zip

      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.20
          name: GitarGame v0.1.0-alpha.20
          prerelease: true
          make_latest: false
          body: |
            Compatibility and gameplay-feedback pass on top of alpha.19.

            Compatibility:
            - Fixes the alpha.19 Opus-only regression caused by routing .opus detection through the native raylib extension filter
            - Keeps persistent prepared-audio caching as an optimization only
            - Restores the proven direct Opus decoder/mixer fallback whenever cache preparation is unavailable or invalid

            Note feedback:
            - Adds a stronger hit-line flash and expanding receptor impact ring
            - Preserves the existing shaped hit ghost for normal notes, HOPOs, taps, and opens
            - Makes HOPOs visibly glow with a larger animated aura

            Star Power phrases:
            - Renders phrase notes in gold, including opens
            - Keeps HOPO/tap silhouette differences while tinting the phrase treatment

            Whammy:
            - Adds XInput analog whammy detection across common trigger/right-stick mappings
            - Adds Space as a keyboard whammy fallback
            - Provides visible sustain modulation while whammy is active
            - Grants incremental Star Power while whammying an already-hit Star Power sustain

            Alpha.19 async loading, persistent PCM cache, UI navigation sounds,
            adjustable highway length, and all alpha.18 gameplay behavior remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.20-win64.zip
