# Alpha.13 validation trigger
# Alpha.13 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.13-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.13-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.13-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.13
          name: GitarGame v0.1.0-alpha.13
          prerelease: true
          make_latest: false
          body: |
            Gameplay feedback and song-flow polish on top of alpha.12.

            Gameplay feedback:
            - Fret receptors flash on successful hits with projected expanding ripple rings
            - Chords ripple every struck receptor; open notes pulse the full receptor row
            - Successful sustains become brighter/wider while the required frets remain held
            - Active sustains gain a luminous core and keep their receptor visibly latched
            - Hit-effect timing uses realtime hit timestamps so video calibration cannot skew animation timing
            - Adds release-gated gameplay feedback/preview timing regression tests

            Song browser:
            - Adds automatic song previews after a short selection debounce
            - Honors song.ini preview_start_time / preview_end_time in milliseconds
            - Prefers dedicated preview audio when present
            - Adds native preview.opus decoding so Rock Band/YARG packages do not need full multistem mixing for previews
            - Falls back to a bounded regular-stem preview segment when no dedicated preview exists
            - Preview audio stops cleanly before gameplay and when leaving song select

            Song flow:
            - Detects actual audio completion and automatically returns to song select
            - Keeps the just-played song selected so browsing can continue naturally

            All alpha.12 A/V calibration, alpha.11 MIDI sustain compatibility,
            alpha.10 fullscreen folder picker, and alpha.9 MIDI/Opus song support remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.13-win64.zip
