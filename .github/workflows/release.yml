# Alpha.22 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.22-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.22-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.22-win64.zip

      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.22
          name: GitarGame v0.1.0-alpha.22
          prerelease: true
          make_latest: false
          body: |
            HOPO compatibility and dense-strumming fix on top of alpha.21.

            - Honors Clone Hero song.ini hopo_threshold overrides for both .chart and MIDI songs
            - Keeps the standard 65/192 natural-HOPO threshold when no override is present
            - Preserves explicit force-HOPO, force-strum, and tap markers
            - Prevents post-HOPO strum-eat forgiveness from swallowing a strum that can legitimately hit the next note
            - Adds regression coverage for default/overridden HOPO thresholds and ~75ms dense-stream strumming

            Alpha.21 library sorting, held scrolling, menu animation, hit flashes,
            alpha.20 whammy/SP visuals, and earlier compatibility behavior remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.22-win64.zip
