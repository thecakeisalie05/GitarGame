# Alpha.23 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.23-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.23-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.23-win64.zip

      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.23
          name: GitarGame v0.1.0-alpha.23
          prerelease: true
          make_latest: false
          body: |
            Rock Band 2 / legacy HOPO metadata compatibility on top of alpha.22.

            - Adds song.ini hopo_frequency and hopofreq support as direct tick-threshold aliases
            - Adds eighthnote_hopo support for legacy Rock Band/FoF-era conversions
            - eighthnote_hopo expands the natural HOPO cutoff to one eighth-note step (resolution / 2)
            - Explicit hopo_frequency/hopofreq values take precedence over eighthnote_hopo
            - Applies the metadata consistently to both .chart and MIDI imports
            - Adds regression tests matching the Bodhisattva-style 8th-note HOPO behavior

            Alpha.22 dense-stream strum handling and all previous gameplay/UI improvements remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.23-win64.zip
