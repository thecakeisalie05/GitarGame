name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.8-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.8-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.8-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.8
          name: GitarGame v0.1.0-alpha.8
          prerelease: true
          make_latest: false
          body: |
            Gameplay-visual polish pass plus restart-state fix.

            Highway grid:
            - Replaces static evenly spaced depth guides with chart-derived musical beat and measure lines
            - Measure bars are generated from chart Resolution and time-signature events
            - Tempo changes naturally change their visual spacing because grid ticks are converted through the same tempo map as notes
            - Beat/measure lines move down the 3D highway using the exact same time-to-Z projection as gems
            - Strong measure bars and subtler beat subdivisions improve phrase/readability without adding meaningful GPU load
            - Adds regression coverage for measure generation across a 4/4 to 3/4 time-signature change and BPM change

            Note readability:
            - HOPOs now use a smaller raised colored face with a bright pale outer rim, giving them a distinct silhouette from strum notes
            - Tap notes use an even brighter white cap with colored core so taps remain distinct from both HOPOs and strums
            - Normal strum notes remain broad solid lane-colored pucks
            - Missed notes retain the red ghost treatment regardless of note type

            Restart fix:
            - Adds a decoder rewind guard around song restart
            - Prevents a stale pre-seek GetMusicTimePlayed value from instantly marking the freshly reset chart as missed
            - resetChartState continues to clear all note hit/miss visuals, Star Power meter/activation, rock meter, phrase state, score/combo, and judgment text
            - The highway is held at the initial chart position only until the audio decoder confirms the rewind (with a short safety timeout)

            Existing alpha.7 chart verification, timing compatibility, HUD feedback, menus, calibration, artwork, customization, logging and crash dumps remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.8-win64.zip