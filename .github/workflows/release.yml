# Alpha.24 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.24-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.24-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.24-win64.zip

      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.24
          name: GitarGame v0.1.0-alpha.24
          prerelease: true
          make_latest: false
          body: |
            Audio-feedback and hit-FX polish on top of alpha.23.

            Visual feedback:
            - Replaces the layered grey-ish hit haze with a shorter, cleaner white flash
            - Keeps the expanding impact concept while reducing visual clutter

            Instrument audio feedback:
            - Adds whammy pitch bending on isolated guitar/rhythm stems
            - Adds mute-on-miss for isolated guitar/rhythm stems
            - Successful notes restore the instrument immediately
            - Mixed single-track songs are intentionally left untouched
            - Opus packages with isolated guitar/rhythm stems are preserved as separate streams so the effects can work
            - Whammy pitch is restored to 1.0 and the instrument stem is re-synced to the master clock when the bar returns to rest

            Alpha.23 legacy HOPO compatibility and all prior gameplay fixes remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.24-win64.zip
