name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.3-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.3-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.3-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.3
          name: GitarGame v0.1.0-alpha.3
          prerelease: true
          make_latest: false
          body: |
            Unicode filesystem crash fix based on the alpha.2 user crash dump.

            Changes in alpha.3:
            - Forces the MSVC filesystem narrow-conversion locale to UTF-8 before main()
            - Fixes startup crashes when recursive song scanning encounters filenames that cannot be represented by the legacy Windows ANSI code page
            - Specifically addresses std::system_error / Win32 ERROR_NO_UNICODE_TRANSLATION (1113)
            - Retains persistent GitarGame.log and GitarGame-crash.dmp diagnostics
            - Retains PDB symbols in the portable package for dump analysis

            Existing alpha functionality:
            - ExpertSingle .chart playback
            - Multi-stem OGG/MP3/WAV/FLAC audio
            - Basic chords, sustains, HOPOs, forced notes, and taps
            - XInput controller binding wizard and diagnostics
            - Independent configurable XInput polling thread
            - Configurable highway speed/length, color scheme, directories, FPS, hit window, volume, and offset
            - Recursive Clone Hero-style song library scanning

            If this build still crashes, send GitarGame.log and GitarGame-crash.dmp.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.3-win64.zip
