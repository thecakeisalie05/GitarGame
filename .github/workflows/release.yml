# Alpha.21 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.21-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.21-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.21-win64.zip

      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.21
          name: GitarGame v0.1.0-alpha.21
          prerelease: true
          make_latest: false
          body: |
            Library UX and visual-feedback pass on top of alpha.20.

            Song library:
            - Hold keyboard Up/Down or guitar strum to continuously browse
            - Held scrolling accelerates over time for large libraries
            - Left/Right or Yellow/Blue cycles sorting by Artist, Title, Album, Year, or Folder
            - Re-sorting preserves the currently selected song

            Menus:
            - Adds animated time-based color accents to selected menu entries
            - Adds moving colored background streaks on the main menu
            - Adds animated color treatment to the selected song row

            Hit feedback:
            - Adds a brief white-hot core flash and layered translucent lane-color halos on note hits
            - Adds a full-width white flash for open-note hits
            - Uses geometry-based glow for clarity/performance rather than requiring an HDR/post-process bloom pipeline

            Alpha.20 compatibility restoration, whammy, Star Power phrase visuals,
            async loading, persistent audio cache, and Clone Hero-style gameplay behavior remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.21-win64.zip
