# Alpha.11 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.11-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.11-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.11-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.11
          name: GitarGame v0.1.0-alpha.11
          prerelease: true
          make_latest: false
          body: |
            MIDI sustain-compatibility fix on top of alpha.10.

            MIDI gameplay compatibility:
            - Applies the Clone Hero-style default MIDI sustain cutoff of floor(resolution / 3) + 1 ticks
            - Short DAW-authored MIDI note lengths are now normalized to ordinary gems instead of rendering every gem as a sustain
            - Real sustains longer than the cutoff remain intact, including per-lane chord sustain lengths
            - Supports song.ini sustain_cutoff_threshold overrides (and the historical misspelled sustain_cuttoff_threshold alias defensively)
            - Logs the active MIDI sustain cutoff as a chart compatibility info entry
            - Adds a dedicated release-gated regression test proving short 60-tick gems are cut at 480 PPQN while 240-tick sustains survive, plus override behavior

            All alpha.10 fullscreen folder-picker behavior and alpha.9 MIDI/Opus song support remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.11-win64.zip
