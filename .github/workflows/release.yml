# Alpha.12 validation trigger
# Alpha.12 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.12-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.12-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.12-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.12
          name: GitarGame v0.1.0-alpha.12
          prerelease: true
          make_latest: false
          body: |
            Robust A/V calibration and UI motion pass on top of alpha.11.

            Calibration:
            - Adds separate persisted audio/input and video offsets
            - Audio/input calibration affects hit judgment; video calibration affects rendering only
            - Full A/V mode performs an audible-click pass followed by a visual crossing pass
            - Adds dedicated Audio-only and Video-only calibration modes
            - Video calibration alternates marker direction to reduce anticipation bias
            - Uses robust median/MAD-style outlier rejection instead of a raw one-shot average
            - Reports accepted sample count, spread and quality before applying
            - Settings > Video now exposes manual video offset and direct auto video calibration
            - Adds release-gated calibration estimator regression tests

            UI motion:
            - Menu selections ease between rows instead of snapping
            - Selected buttons get restrained pulse/glow and text-slide feedback
            - Settings category and settings-row selection now animate
            - Main-menu lane streaks have subtle ambient motion

            All alpha.11 MIDI sustain compatibility, alpha.10 fullscreen folder picker,
            alpha.9 MIDI/Opus song support, chart verification and gameplay feedback remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.12-win64.zip
