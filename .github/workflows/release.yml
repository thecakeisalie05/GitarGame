# Alpha.19 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.19-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.19-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.19-win64.zip

      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.19
          name: GitarGame v0.1.0-alpha.19
          prerelease: true
          make_latest: false
          body: |
            UI polish and responsive-loading pass on top of alpha.18.

            Start screen and navigation:
            - Removes the old title-screen tagline/marketing copy
            - Adds subtle generated move, accept, and back navigation sounds with no external asset dependency

            Highway:
            - Expands highway-length adjustment to 30%-140%
            - Uses finer 2.5% adjustment steps and persists the setting normally

            Audio loading:
            - Moves expensive Opus preview decode and multi-stem mixing off the render/UI thread
            - Keeps raylib Music creation on the main thread for safe audio-device ownership
            - Prewarms the currently selected browser song after selection settles
            - Shows a responsive Loading audio... state instead of freezing when Play is pressed before preparation finishes
            - Persists prepared PCM WAVs under the local GitarGame cache so repeat loads and future launches avoid re-decoding
            - Cache keys include source path, file size, and modification time so changed Opus files invalidate automatically
            - Native OGG/MP3/WAV/FLAC packages continue using direct streaming

            Alpha.18 Clone Hero gameplay compatibility, calibration persistence,
            MIDI/Opus chart support, previews, visuals, and song-completion flow remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.19-win64.zip
