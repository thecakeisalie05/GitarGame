name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.9-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.9-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.9-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.9
          name: GitarGame v0.1.0-alpha.9
          prerelease: true
          make_latest: false
          body: |
            Song-library compatibility and clean-install defaults overhaul.

            Song discovery / chart compatibility:
            - Song scanning recognizes notes.chart, notes.mid and notes.midi recursively
            - Folders containing both formats prefer notes.chart deterministically
            - Adds native Standard MIDI File type 0/1 parsing with PPQN timing
            - Normalizes PART GUITAR / T1 GEMS Expert five-fret MIDI into the same ChartData used by .chart
            - Reads MIDI tempo changes and time signatures into the existing verified timing map
            - Supports Expert open notes (95), five fret gems (96-100), force-HOPO (101), force-strum (102), tap markers (104) and Star Power phrases (116)
            - Adds an in-CI synthetic MIDI regression fixture covering tempo changes, forced HOPO/strum, taps and Star Power

            Audio compatibility:
            - Adds Ogg Opus decoding through pinned libogg/libopus/libopusfile dependencies
            - Rock Band/YARG-style multi-stem .opus packages are decoded and mixed to an in-memory stereo PCM stream at song load
            - preview.opus is excluded from playback
            - The mixed stream is handed back to the same raylib Music transport used by existing OGG/MP3/WAV/FLAC songs, keeping one authoritative gameplay clock

            New clean-install defaults:
            - Highway speed 1.75x
            - Highway length 95%
            - FPS uncapped
            - Fullscreen enabled
            - Native monitor resolution enabled
            - Neon theme
            - Camera FOV 50 degrees
            - Highway width 7.0

            Existing config.ini/ui.ini files are preserved so upgrading does not overwrite a player's current preferences.

            Existing alpha.8 musical measure bars, HOPO/tap visuals, restart safety, chart verification, gameplay feedback, menus, calibration, artwork, logging and crash dumps remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.9-win64.zip
