# Alpha.16 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.16-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.16-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.16-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.16
          name: GitarGame v0.1.0-alpha.16
          prerelease: true
          make_latest: false
          body: |
            Clone Hero-like timing/input engine pass on top of alpha.15.

            Timing and responsiveness:
            - Changes the clean-install hit window from +/-120 ms to a CH-like +/-70 ms baseline (~140 ms total)
            - Existing configs still on the historical 120 ms default are migrated once; custom window values are preserved
            - Clarifies the settings UI as half-window and total-window timing
            - Judges XInput actions at their 1000 Hz poll timestamps instead of the later render-frame timestamp
            - Preserves the complete controller-button snapshot for every poll event
            - Defers frame-wide miss commitment until timestamped inputs have been processed
            - Groups simultaneous fret/strum changes from the same poll as one musical action

            Guitar rules:
            - HOPO fret transitions require an active combo; HOPOs can always still be strummed
            - Taps remain fret-hittable without an active combo
            - Implements actual pull-offs by recognizing higher-fret releases that reveal the target fret
            - Implements open HOPO/open tap hits by releasing all frets at the correct time
            - Preserves lower-fret anchoring for single notes and exact matching for chords
            - Overstrums now also invalidate an active Star Power phrase
            - Keyboard follows the same press/release semantics, though XInput retains the higher-resolution timestamps

            Verification:
            - Adds a dedicated guitar-engine regression suite covering anchoring, chords, HOPO combo gating,
              pull-offs, taps, open fret-release notes, hit-window boundaries, and timestamp mapping

            Existing alpha.15 native Windows picker hardening, alpha.14 visuals,
            alpha.13 previews/song completion, calibration, MIDI/Opus compatibility and chart verification remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.16-win64.zip
