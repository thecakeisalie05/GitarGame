# Alpha.17 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.17-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.17-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.17-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.17
          name: GitarGame v0.1.0-alpha.17
          prerelease: true
          make_latest: false
          body: |
            Gameplay-feel and calibration-persistence refinement on top of alpha.16.

            Hit-window / Clone Hero feel:
            - Keeps alpha.16's high-resolution XInput timestamping and low-latency judgment path
            - Relaxes the untouched alpha.16 default from +/-70 ms to +/-90 ms (~180 ms total)
            - Preserves custom hit-window values; only the alpha.16 default is migrated
            - Adds normal Clone Hero-style early HOPO/tap frontend buffering
            - Correct HOPO/tap fret transitions can be armed before the front edge and awarded when the window reaches them
            - Frontend arms cancel if the player changes away from the required fret state
            - HOPO frontend arms also cancel if combo is broken; taps remain combo-independent

            Calibration persistence:
            - Audio/input and video offsets continue to live in config.ini
            - Windows additionally mirrors calibration to %LOCALAPPDATA%/GitarGame/calibration.ini
            - The persistent profile is loaded after config.ini and survives executable replacement or portable-folder changes
            - Existing config calibration is migrated into the persistent profile on first alpha.17 launch
            - Auto calibration, Settings offset adjustments and F7/F8/F9 manual timing controls all update the persistent profile
            - Adds release-gated calibration-profile serialization/round-trip tests

            Existing alpha.15 native picker hardening, alpha.14 visuals, alpha.13 previews/song completion,
            alpha.12 calibration, MIDI/Opus compatibility and chart verification remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.17-win64.zip
