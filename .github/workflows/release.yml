name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.5-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.5-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.5-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.5
          name: GitarGame v0.1.0-alpha.5
          prerelease: true
          make_latest: false
          body: |
            QoL/UI-focused alpha.

            Changes in alpha.5:
            - Fixes the mirrored/reversed visible lane color order on the 3D highway
            - Adds a main menu and a real pause menu
            - Adds guitar-driven menu navigation: strum up/down, green select, red back, yellow/blue adjust
            - Adds an in-game settings system with Gameplay, Audio & Timing, Video, Appearance, Input, and Song Library categories
            - Adds live highway speed/length, hit window, volume, timing, FPS, polling, note-size, FOV, and highway-width controls
            - Adds palette presets plus individual per-lane color selection
            - Adds toggles for depth guides, album art, fullscreen, FPS display, and input diagnostics
            - Adds a native Windows folder picker for choosing the song library
            - Adds a click-based calibration tool that collects multiple strum samples and suggests a timing offset
            - Adds album/cover artwork loading from common song-folder filenames
            - Adds album, year, genre, and charter metadata to the song browser
            - Reworks the song browser into a list + selected-song detail/art panel
            - Adds persistent ui.ini presentation settings beside config.ini
            - Keeps the audio-clock timing fixes, Unicode song-library fix, crash logs/dumps, and PDB symbols

            Guitar UI defaults:
            - Strum: move up/down
            - Green: select
            - Red: back
            - Yellow/Blue: decrease/increase
            - Start: pause during gameplay

            This remains an early alpha: the UI is intentionally lightweight and the gameplay engine is still ExpertSingle .chart focused.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.5-win64.zip
