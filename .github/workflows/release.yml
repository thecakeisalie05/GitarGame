name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.2-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.2-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.2-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.2
          name: GitarGame v0.1.0-alpha.2
          prerelease: true
          make_latest: false
          body: |
            Diagnostic/stability follow-up to the first playable alpha.

            Changes in alpha.2:
            - Persistent GitarGame.log beside the executable
            - Windows unhandled-exception logging with exception code, address, and module RVA
            - Automatic GitarGame-crash.dmp generation on native crashes
            - Debug symbols included in the portable package for crash diagnosis
            - Startup instrumentation around window, FPS, audio, XInput, and first-frame initialization
            - Failed audio initialization now skips master-volume setup instead of assuming the backend is valid

            Existing alpha functionality:
            - ExpertSingle .chart playback
            - Multi-stem OGG/MP3/WAV/FLAC audio
            - Basic chords, sustains, HOPOs, forced notes, and taps
            - XInput controller binding wizard and diagnostics
            - Independent configurable XInput polling thread
            - Configurable highway speed/length, color scheme, directories, FPS, hit window, volume, and offset
            - Recursive Clone Hero-style song library scanning

            If it still crashes, send GitarGame.log. If GitarGame-crash.dmp also exists, send that too.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.2-win64.zip
