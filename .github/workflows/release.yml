name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.4-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.4-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.4-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.4
          name: GitarGame v0.1.0-alpha.4
          prerelease: true
          make_latest: false
          body: |
            Timing and highway-rendering follow-up.

            Changes in alpha.4:
            - Uses audio playback as the master gameplay clock
            - Parses .chart [Song] Offset in seconds
            - Corrects song.ini delay sign semantics (positive delay = later notes)
            - User audio_offset_ms now has explicit calibration semantics: positive = later notes
            - F7/F8 adjust calibration by 5 ms; hold Shift for 25 ms; F9 resets
            - HUD shows raw audio time, corrected chart time, chart Offset, song.ini delay, and calibration
            - Logs timing-map values on song load/reload
            - Replaces the flat highway with a lightweight real perspective 3D highway
            - 3D road uses only a pair of triangles, simple lane lines, low-poly note discs, and boxes for sustains
            - Existing highway_speed and highway_length settings control the 3D highway
            - Retains alpha.3 Unicode filesystem fix, persistent logs, crash dumps, and PDB symbols

            Existing alpha functionality:
            - ExpertSingle .chart playback
            - Multi-stem OGG/MP3/WAV/FLAC audio
            - Basic chords, sustains, HOPOs, forced notes, and taps
            - XInput controller binding wizard and diagnostics
            - Independent configurable XInput polling thread
            - Configurable colors, song directory, FPS, polling, hit window, volume, and offsets

            If timing is still wrong for a specific chart, send its visible Offset/delay values from the HUD or GitarGame.log.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.4-win64.zip
