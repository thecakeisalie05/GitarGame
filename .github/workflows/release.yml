# Alpha.18 release validation workflow
name: Build and Release Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Chart compatibility tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GitarGame.exe dist/GitarGame.exe
          if (Test-Path build/Release/GitarGame.pdb) { Copy-Item build/Release/GitarGame.pdb dist/GitarGame.pdb }
          Copy-Item config.example.ini dist/config.example.ini
          Copy-Item README.md dist/README.md
          $zipItems = @('dist/GitarGame.exe','dist/config.example.ini','dist/README.md')
          if (Test-Path dist/GitarGame.pdb) { $zipItems += 'dist/GitarGame.pdb' }
          Compress-Archive -Path $zipItems -DestinationPath dist/GitarGame-v0.1.0-alpha.18-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitarGame-v0.1.0-alpha.18-win64
          path: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/README.md
            dist/GitarGame-v0.1.0-alpha.18-win64.zip

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.18
          name: GitarGame v0.1.0-alpha.18
          prerelease: true
          make_latest: false
          body: |
            Clone Hero behavioral-compatibility engine pass on top of alpha.17.

            Research-backed timing:
            - Restores the documented Clone Hero core guitar window to +/-70 ms (140 ms total)
            - Implements the separately documented 50 ms early-strum leniency instead of widening the core window
            - Early strums are buffered and become eligible when the note reaches the normal frontend
            - Buffered strums may briefly survive fret-order differences within the same physical gesture

            Clone Hero/GH3-style input state:
            - Replaces alpha.17's single-note frontend arm with persistent infinite-frontend/tap readiness
            - Any real fret transition primes HOPO/tap readiness; hitting a normal strum note also primes the next HOPO
            - HOPO/tap hits consume readiness; misses/overstrums/reset clear it
            - Current held fret state is still checked at hit time, so ghost inputs do not become automatic hits
            - Normal ghost inputs are non-punitive, matching current Clone Hero behavior

            Strum/HOPO interaction:
            - Adds a one-strum post-HOPO/tap eat window to reproduce Clone Hero's forgiving mixed strum/HOPO response
            - Uses 80 ms as an explicitly approximate compatibility value derived from YARG's open-source GH/CH-style engine
            - A second strum while an early-strum buffer is active overstrums, then becomes the new strum action

            Fretting semantics:
            - Single notes retain lower-fret anchoring
            - Strum chords require exact chord frets
            - HOPO/tap chords allow lower-fret anchoring beneath the lowest chord fret
            - Pull-offs and open HOPO/tap releases remain supported

            Existing alpha.17 persistent calibration, alpha.15 native picker hardening,
            alpha.14 visuals, alpha.13 previews/song completion, MIDI/Opus compatibility and chart verification remain intact.
          files: |
            dist/GitarGame.exe
            dist/GitarGame.pdb
            dist/config.example.ini
            dist/GitarGame-v0.1.0-alpha.18-win64.zip
