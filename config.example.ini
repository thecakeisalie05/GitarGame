# GitarGame configuration
# Copy this to config.ini to customize. GitarGame creates config.ini automatically on first launch.

[paths]
songs_directory = songs

[video]
# Native resolution follows the current monitor mode when enabled.
window_width = 1280
window_height = 720
native_resolution = true
fullscreen = true
vsync = false
# 0 = uncapped
fps_cap = 0

[input]
# XInput polling is performed on its own thread on Windows.
# Reasonable values: 125, 250, 500, 1000, 2000, 4000
input_poll_hz = 1000

# These are defaults only. Press F3 in-game to run the controller binding wizard.
xinput_green = A
xinput_red = B
xinput_yellow = Y
xinput_blue = X
xinput_orange = RB
xinput_strum_up = DPAD_UP
xinput_strum_down = DPAD_DOWN
xinput_star_power = LB
xinput_start = START

[gameplay]
# Higher values make notes travel faster down the perspective highway.
highway_speed = 1.75
# Controls how far the 3D highway extends into the scene, 0.35-0.95.
highway_length = 0.95
hit_window_ms = 120
# User calibration. Positive values delay notes; negative values advance notes.
# In game: F7 = earlier, F8 = later, F9 = reset. Hold Shift for 25 ms steps.
audio_offset_ms = 0
master_volume = 0.85

[appearance]
# Presets: classic, neon, pastel, mono
color_scheme = neon
background_color = #04060c
highway_color = #0b0e18
hit_line_color = #e6faff
lane_green = #00ff8c
lane_red = #ff2d5f
lane_yellow = #ffeb28
lane_blue = #2896ff
lane_orange = #ff780f

# ui.ini clean-install defaults (managed by GitarGame):
# camera_fov = 50
# highway_width = 7.0
