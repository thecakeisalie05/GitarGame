# GitarGame configuration
# Copy this to config.ini to customize. GitarGame creates config.ini automatically on first launch.

[paths]
songs_directory = songs

[video]
window_width = 1280
window_height = 720
fullscreen = false
vsync = false
fps_cap = 500

[input]
# XInput polling is performed on its own thread on Windows.
# Reasonable values: 125, 250, 500, 1000, 2000, 4000
input_poll_hz = 1000

# These are defaults only. Press F3 in-game to run the controller binding wizard.
xinput_green = A
xinput_red = B
xinput_yellow = Y
xinput_blue = X
xinput_orange = RB
xinput_strum_up = DPAD_UP
xinput_strum_down = DPAD_DOWN
xinput_star_power = LB
xinput_start = START

[gameplay]
# Higher values make notes move faster. 1.0 is the baseline.
highway_speed = 1.00
# Fraction of the window height occupied by the highway, 0.35-0.95.
highway_length = 0.82
hit_window_ms = 120
audio_offset_ms = 0
master_volume = 0.85

[appearance]
# Presets: classic, neon, pastel, mono
color_scheme = classic
background_color = #101116
highway_color = #1a1d25
hit_line_color = #f5f5f5
lane_green = #35d04f
lane_red = #ef3340
lane_yellow = #ffd23f
lane_blue = #2684ff
lane_orange = #ff8b2c
